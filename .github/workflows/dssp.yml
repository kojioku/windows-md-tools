name: dssp-windows

# mkdssp (DSSP 3.x, cmbi/dssp) for Windows, built with MSYS2 / MinGW-w64 (UCRT64).
# DSSP 3.x, not 4.x: tools that read the classic DSSP 2/3 output through
# `mkdssp -i file.pdb` (e.g. vermouth / martinize2) cannot drive 4.x.

# Started by hand only (gh workflow run / the Actions tab): a push must not start a build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "cmbi/dssp tag to build"
        default: "3.1.4"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      DSSP_TAG: ${{ github.event.inputs.tag || '3.1.4' }}
      PREFIX: ${{ github.workspace }}/dssp-win
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make zip unzip autoconf automake libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2

      - name: Fetch source
        run: |
          git clone --depth 1 --branch "$DSSP_TAG" https://github.com/cmbi/dssp.git dssp-src
          git -C dssp-src log -1 --format='%H %ad %s' | tee dssp_commit.txt

      - name: Build
        run: |
          cd dssp-src
          # Keep the whole log (a failing target's message is often far from the end)
          set +e
          bash ../dssp/build.sh > ../build.log 2>&1
          rc=$?
          set -e
          tail -80 ../build.log
          if [ $rc -ne 0 ]; then
            echo "::group::error lines"
            grep -nE "error:|Error [0-9]+|undefined reference|No rule to make|cannot find" ../build.log | head -80 || true
            echo "::endgroup::"
            exit 1
          fi
        env:
          DSSP_PREFIX: ${{ env.PREFIX }}

      - name: Bundle runtime DLLs
        run: bash scripts/bundle_dlls.sh "$PREFIX"

      - name: Smoke test (no MSYS2 on PATH)
        shell: pwsh
        run: ./dssp/smoke.ps1 -Prefix "$env:PREFIX" -Out smoke-out

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dssp-build-logs
          retention-days: 7   # a run is often read days later (run 42422874267's log had expired)
          if-no-files-found: ignore
          path: |
            build.log
            dssp_commit.txt
            dssp-src/config.log
            smoke-out

      - name: Package
        run: |
          PREFIX="$(cygpath -u "$PREFIX")"
          mkdir -p "$PREFIX/licenses/dssp"
          cp dssp-src/COPYING dssp-src/LICENSE_1_0.txt dssp-src/AUTHORS "$PREFIX/licenses/dssp/"
          test -n "$(ls "$PREFIX/licenses/dssp")"
          cp dssp_commit.txt "$PREFIX/SOURCE-COMMIT.txt"
          cp dssp/README.md "$PREFIX/README.md"
          cp NOTICE.md "$PREFIX/NOTICE.md"
          cd "$GITHUB_WORKSPACE" && zip -qr "dssp-${HSSP_TAG}-win64.zip" dssp-win
          unzip -l "dssp-${HSSP_TAG}-win64.zip" | grep -q "dssp-win/bin/mkdssp.exe"
          ls -la "dssp-${HSSP_TAG}-win64.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: dssp-win64
          retention-days: 1
          path: dssp-*-win64.zip
